name: Sync from Gitee

# 已改用 Gitee 推送镜像（Gitee → GitHub），此 workflow 仅作备用手动触发
# 配置方法：Gitee 仓库 → 管理 → 仓库镜像管理 → 添加 Push 方向镜像
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee remote with token
        run: |
          git remote add gitee https://hoshinokennji:${{ secrets.GITEE_TOKEN }}@gitee.com/hoshinokennji/SiliconLifeCollective.git

      - name: Fetch from Gitee (with retry)
        run: |
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: fetching from Gitee..."
            if git fetch gitee --tags --force; then
              echo "Fetch succeeded on attempt $i"
              exit 0
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              DELAY=$((10 * i))
              echo "Fetch failed, retrying in ${DELAY}s..."
              sleep $DELAY
            fi
          done
          echo "All $MAX_RETRIES attempts failed"
          exit 1
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: Check for changes
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse gitee/master)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to sync"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected: $LOCAL -> $REMOTE"
          fi

      - name: Sync master branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git checkout master
          git merge gitee/master --allow-unrelated-histories --strategy-option=theirs
          git push origin master --force

      - name: Sync all branches
        if: steps.check.outputs.has_changes == 'true'
        run: |
          for branch in $(git branch -r | grep 'gitee/' | grep -v 'HEAD' | sed 's/gitee\///'); do
            if [ "$branch" = "master" ]; then continue; fi
            git checkout $branch 2>/dev/null || git checkout -b $branch gitee/$branch
            git push origin $branch --force
          done

      - name: Sync tags
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin --tags --force
