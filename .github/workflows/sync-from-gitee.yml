name: Sync from Gitee

on:
  schedule:
    # 每小时同步一次（UTC 时间，对应北京时间 +8）
    - cron: '0 * * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee remote
        run: |
          git remote add gitee https://gitee.com/hoshinokennji/SiliconLifeCollective.git

      - name: Fetch from Gitee
        run: |
          git fetch gitee --tags --force

      - name: Sync master branch
        run: |
          git checkout master
          git merge gitee/master --allow-unrelated-histories --strategy-option=theirs
          git push origin master --force

      - name: Sync all branches
        run: |
          for branch in $(git branch -r | grep 'gitee/' | grep -v 'HEAD' | sed 's/gitee\///'); do
            git checkout $branch 2>/dev/null || git checkout -b $branch gitee/$branch
            git push origin $branch --force
          done

      - name: Sync tags
        run: |
          git push origin --tags --force
